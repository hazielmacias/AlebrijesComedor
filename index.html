<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<meta name="description" content="Control del comedor · Casa Club Alebrijes Teotihuacán">
<title>Casa Club Alebrijes Teotihuacán · Comedor</title>
<link rel="icon" type="image/png" href="assets/Alebrijes Teotihuacan.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="splash" class="splash" role="status" aria-label="Cargando">
  <img src="assets/Alebrijes Teotihuacan.png" alt="Alebrijes Teotihuacán">
  <span class="splash-pulse" aria-hidden="true"></span>
</div>

<div id="fatal" class="fatal hidden" role="alert">
  <div class="fatal-card">
    <h2>No pudimos arrancar</h2>
    <p id="fatal-msg">Ocurrió un error inesperado.</p>
    <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
  </div>
</div>

<div id="app"></div>

<div id="print-root" aria-hidden="true"></div>

<div id="toast" class="toast" role="status"></div>

<script src="js/vendor/supabase.min.js"></script>
<script src="js/vendor/qrcode-generator.min.js"></script>
<script src="js/vendor/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
